name: Update Rates

on:
  schedule:
    # 5am ET nightly — before the day's traffic, after PriceLabs has refreshed.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch rates from PriceLabs
        env:
          PRICELABS_API_KEY: ${{ secrets.PRICELABS_API_KEY }}
          PRICELABS_API_URL: ${{ vars.PRICELABS_API_URL }}
        run: python scripts/fetch_rates.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet src/_data/rates.json; then
            echo "Rates unchanged — nothing to commit."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "changed=true" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/_data/rates.json
          git commit -m "Update rates from PriceLabs ($(date -u +%Y-%m-%d))"
          git push

    outputs:
      changed: ${{ steps.commit.outputs.changed }}

  # A push made with GITHUB_TOKEN does not trigger the push-based deploy, so the
  # new rates would sit in the repo and never reach the live page. Call it here.
  deploy:
    needs: update-rates
    if: needs.update-rates.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
