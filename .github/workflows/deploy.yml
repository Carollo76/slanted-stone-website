name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'worker/**'
      - '.eleventy.js'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  # Called by update-rates.yml. A push made with the default GITHUB_TOKEN does not
  # trigger other workflows, so the nightly rates job has to invoke this directly
  # or its commit would never reach production.
  workflow_call:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build
        run: npx @11ty/eleventy

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify production
        run: |
          # Cloudflare needs a moment to propagate the new version.
          sleep 20
          ./scripts/preflight.sh https://slantedstone.com
